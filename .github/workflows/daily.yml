name: Daily digest

on:
  schedule:
    # 05:30 UTC = 06:30 in UK summer time, 05:30 in winter.
    # GitHub can start scheduled runs up to ~30 minutes late.
    - cron: "30 5 * * *"
  workflow_dispatch: # adds a "Run workflow" button for testing

permissions:
  contents: write

concurrency: daily-digest

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch news and write digest
        run: python main.py --no-notify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Publish to GitHub Pages
        run: |
          git config user.name "AI Morning Brief"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git commit -m "Digest for $(date -u +%Y-%m-%d)" || echo "No changes"
          git push

      - name: Notify phone and PC
        run: |
          sleep 90  # give GitHub Pages time to publish the new page
          python main.py --notify-only
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: ${{ vars.SITE_URL }}
