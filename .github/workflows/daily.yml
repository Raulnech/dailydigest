name: Daily digest

on:
  schedule:
    # GitHub sometimes delays or skips scheduled runs, so we try three times.
    # Whichever runs first makes the digest; the others see it exists and stop.
    # Times are UTC. 05:00 UTC = 6am in UK summer time (5am in winter).
    - cron: "0 5 * * *"
    - cron: "45 5 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch: # the "Run workflow" button always makes a fresh digest

permissions:
  contents: write

concurrency: daily-digest

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether today's digest already exists
        id: check
        run: |
          today=$(TZ=Europe/London date +%Y-%m-%d)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "docs/archive/$today.html" ]; then
            echo "Today's digest already exists, nothing to do."
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.done != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.check.outputs.done != 'true'
        run: pip install -r requirements.txt

      - name: Fetch news and write digest
        if: steps.check.outputs.done != 'true'
        run: python main.py --no-notify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Publish to GitHub Pages
        if: steps.check.outputs.done != 'true'
        run: |
          git config user.name "AI Morning Brief"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git commit -m "Digest for $(TZ=Europe/London date +%Y-%m-%d)" || echo "No changes"
          # Pick up anything pushed while this run was going, then push
          git pull --rebase origin main
          git push

      - name: Notify phone and PC
        if: steps.check.outputs.done != 'true'
        run: |
          sleep 90  # give GitHub Pages time to publish the new page
          python main.py --notify-only
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: ${{ vars.SITE_URL }}
